name: Avidemux Multi platforms & archs Factory

on:
  workflow_dispatch:
  push:
  #   tags:
  #     - "[0-9]+.[0-9]+.[0-9]+*" # Triggers strictly for clean semantic version numbers (e.g., 2.8.1)
    branches:
      - dev-ci

env:
  AVIDEMUX_REPO: "https://github.com/mean00/avidemux2.git"
  # Frozen build scripts (november 2026)
  AVIDEMUX_BUILD_SCRIPTS_FROZEN_REV: "c7e6576d605de685fae0b126204e4258aa92026d"
  # AVIDEMUX_BUILD_SCRIPT_BASE_URL: "https://raw.githubusercontent.com/mean00/avidemux2/c7e6576d605de685fae0b126204e4258aa92026d"

jobs:
  # =================================================================
  # MACOS BUILD FACTORY (FACTORIZED INTEL & ARM64)
  # =================================================================
  build-macos:
    name: macOS (${{ matrix.arch }})
    runs-on: macos-14 # Native Apple Silicon M1/M2 infrastructure
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            qt_path: /opt/homebrew/opt/qt
            script: bootStrapMacOS_Monterey.arm64.sh
            deployment_target: ""
            cmake_arch: "arm64"
          # - arch: intel
          #   qt_path: /usr/local/opt/qt
          #   script: bootStrapMacOS_Sonoma.sh
          #   deployment_target: "11.0" # Ensures binary runtime compatibility down to macOS Big Sur
          #   cmake_arch: "x86_64" # Cross-compile into Intel x86_64 binaries
    steps:
      - name: Checkout Build Repo
        uses: actions/checkout@v4

      - name: Install macOS Build System Dependencies
        run: |
          brew install cmake pkg-config ninja nasm yasm qt xvid x264 x265 libvpx aom opus fdk-aac lame libass mp4v2 a52dec

      - name: Clone Official Avidemux Repository
        # run: git clone --recursive --branch ${{ github.ref_name }} ${{ env.AVIDEMUX_REPO }} avidemux2
        run: |
          # Clone the repo to the targeted frozen build framework
          git clone --recursive --revision ${{ env.AVIDEMUX_BUILD_SCRIPTS_FROZEN_REV }} ${{ env.AVIDEMUX_REPO }} avidemux2
          cd avidemux2
          # Fetch tags
          git fetch --tags
          # Roll back the application components to targeted version
          git checkout 2.8.1 -- avidemux/ avidemux_core/ avidemux_plugins/ myOwnPlugins/
          git submodule update --init --recursive

      - name: Compile and Package Application into DMG Bundle
        env:
          # MYQT: ${{ matrix.qt_path }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
          CMAKE_OSX_ARCHITECTURES: ${{ matrix.cmake_arch }}
        run: |
          # Create a 5GB case-sensitive virtual RAM disk volume
          hdiutil create -size 5g -fs "Case-Sensitive APFS" -volname AvidemuxBuild -attach /tmp/AvidemuxBuild.dmg
          # Copy source to build volume
          cp -R avidemux2 /Volumes/AvidemuxBuild/
          cd /Volumes/AvidemuxBuild/avidemux2
          # Explicitly executing via bash shields execution against environment POSIX shell overrides
          bash ${{ matrix.script }}
          # Copy back the completed installer package to the main workspace
          mkdir -p ${{ github.workspace }}/avidemux2/installer
          cp installer/*.dmg ${{ github.workspace }}/avidemux2/installer/

      - name: Upload macOS Distribution Package to Release
        uses: softprops/action-gh-release@v2
        with:
          files: "avidemux2/installer/*.dmg"
          tag_name: "test-build"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

