name: Avidemux Multi platforms & archs Factory

on:
  workflow_dispatch:
  push:
  #   tags:
  #     - "[0-9]+.[0-9]+.[0-9]+*" # Triggers strictly for clean semantic version numbers (e.g., 2.8.1)
    branches:
      - dev-ci

env:
  AVIDEMUX_REPO: "https://github.com/mean00/avidemux2.git"
  # Frozen build scripts (november 2026)
  AVIDEMUX_BUILD_SCRIPTS_FROZEN_REV: "c7e6576d605de685fae0b126204e4258aa92026d"
  # AVIDEMUX_BUILD_SCRIPT_BASE_URL: "https://raw.githubusercontent.com/mean00/avidemux2/c7e6576d605de685fae0b126204e4258aa92026d"

jobs:
  # =================================================================
  # MACOS BUILD FACTORY (FACTORIZED INTEL & ARM64)
  # =================================================================
  build-macos:
    name: macOS (${{ matrix.arch }})
    runs-on: macos-latest # Native Apple Silicon M1/M2 infrastructure
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            qt_path: /opt/homebrew/opt/qt
            # script: bootStrapMacOS_Monterey.arm64.sh
            script: bootStrapMacOS_Sonoma.sh
            deployment_target: ""
            cmake_arch: "arm64"
          # - arch: intel
          #   qt_path: /usr/local/opt/qt
          #   script: bootStrapMacOS_Sonoma.sh
          #   deployment_target: "11.0" # Ensures binary runtime compatibility down to macOS Big Sur
          #   cmake_arch: "x86_64" # Cross-compile into Intel x86_64 binaries
    steps:
      - name: Checkout Build Repo
        uses: actions/checkout@v4

      - name: Install macOS Build System Dependencies
        run: |
          brew install cmake pkg-config ninja nasm yasm qt xvid x264 x265 libvpx aom opus fdk-aac lame libass mp4v2 a52dec

      - name: Create a 5gb case-sensitive volume
        run: hdiutil create -size 5g -fs "Case-sensitive APFS" -volname AvidemuxBuild /tmp/AvidemuxBuild.dmg -attach

      - name: Clone Official Avidemux Repository
        # run: git clone --recursive --branch ${{ github.ref_name }} ${{ env.AVIDEMUX_REPO }} avidemux2
        run: |
          cd /Volumes/AvidemuxBuild/
          # Clone the repo to the targeted frozen build framework
          git clone --recursive --revision ${{ env.AVIDEMUX_BUILD_SCRIPTS_FROZEN_REV }} ${{ env.AVIDEMUX_REPO }} avidemux2
          cd avidemux2
          # Fetch tags
          git fetch --tags
          # Purges all code directories before roll back to targeted version
          rm -rf cmake/ avidemux/ avidemux_core/ avidemux_plugins/ myOwnPlugins/
          # Roll back the application components to targeted version
          git checkout 2.8.1 -- cmake/ avidemux/ avidemux_core/ avidemux_plugins/ myOwnPlugins/
          git submodule update --init --recursive
          # Duplicate the cmake infrastructure mapping to fix historical layout lookup failures
          cp -R cmake avidemux_core/

      - name: Fetch and Patch Modern Unified Build Script
        run: |
          cd /Volumes/AvidemuxBuild/avidemux2/
          sed -i '' 's|export MYQT=/usr/local/Cellar/qt/6.7.3|export MYQT="${MYQT:-/usr/local/Cellar/qt/6.7.3}"|g' bootStrapMacOS_Sonoma.sh
          sed -i '' 's|export PATH=/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk/usr/lib:$PATH|# Neutralized PATH patch|g' bootStrapMacOS_Sonoma.sh
          sed -i '' 's|export LIBRARY_PATH="$LIBRARY_PATH:/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk/usr/lib"|# Neutralized LIBRARY_PATH patch|g' bootStrapMacOS_Sonoma.sh
          sed -i '' 's|-DCMAKE_OSX_ARCHITECTURES="x86_64"|-DCMAKE_OSX_ARCHITECTURES="${CMAKE_OSX_ARCHITECTURES:-x86_64}" -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_POLICY_DEFAULT_CMP0025=OLD -DCMAKE_POLICY_DEFAULT_CMP0042=OLD -DCMAKE_CXX_FLAGS=-Wno-c++11-narrowing|g' bootStrapMacOS_Sonoma.sh
          # sed -i '' 's|-G "$BUILDER"|-G "$BUILDER" -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_POLICY_DEFAULT_CMP0025=OLD -DCMAKE_POLICY_DEFAULT_CMP0042=OLD|g' bootStrapMacOS_Sonoma.sh
          sed -i '' 's|BUILDER="Ninja"|BUILDER="Unix Makefiles"|g' bootStrapMacOS_Sonoma.sh
          # Replace calls to ninja by make and make install
          sed -i '' 's|ninja >/tmp/log${BASE}|make|g' bootStrapMacOS_Sonoma.sh
          sed -i '' 's|DESTDIR="$FAKEROOT_DIR" ninja install|DESTDIR="$FAKEROOT_DIR" make install|g' bootStrapMacOS_Sonoma.sh
          cat bootStrapMacOS_Sonoma.sh

      - name: Compile and Package Application into DMG Bundle
        env:
          MYQT: ${{ matrix.qt_path }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
          CMAKE_OSX_ARCHITECTURES: ${{ matrix.cmake_arch }}
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          CMAKE_POLICY_DEFAULT_CMP0025: "OLD"
          CMAKE_POLICY_DEFAULT_CMP0042: "OLD"
          CMAKE_CXX_FLAGS: "-Wno-c++11-narrowing"
          CMAKE_FLAGS: "-DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_POLICY_DEFAULT_CMP0025=OLD -DCMAKE_POLICY_DEFAULT_CMP0042=OLD -DCMAKE_CXX_FLAGS=-Wno-c++11-narrowing"
          CPATH: ""
          C_INCLUDE_PATH: ""
          CPLUS_INCLUDE_PATH: ""
        run: |
          cd /Volumes/AvidemuxBuild/avidemux2
          # Explicitly executing via bash shields execution against environment POSIX shell overrides
          bash ${{ matrix.script }}
          # if ! bash ${{ matrix.script }}; then
          #   echo "===================================================="
          #   echo " !!! COMPILATION CRASH LOG DETECTED !!!"
          #   echo "===================================================="
          #   # Forces the console to print out the hidden nested log file structure
          #   cat /tmp/logbuildCore
          #   exit 1
          # fi

      - name: Upload macOS Distribution Package to Release
        uses: softprops/action-gh-release@v2
        with:
          files: "/Volumes/AvidemuxBuild/avidemux2/installer/*.dmg"
          tag_name: "test-build"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

